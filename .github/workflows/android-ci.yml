name: Pomme Compose CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build both modules
        run: ./gradlew --no-daemon --stacktrace :pomme:assembleDebug :sample:assembleDebug

      - name: Lint both modules
        run: ./gradlew --no-daemon --stacktrace :pomme:lintDebug :sample:lintDebug

      - name: Run unit tests and create coverage reports
        run: >-
          ./gradlew --no-daemon --stacktrace
          :pomme:testDebugUnitTest
          :sample:testDebugUnitTest
          :pomme:createDebugUnitTestCoverageReport
          :sample:createDebugUnitTestCoverageReport

      - name: Upload unit test coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-coverage-reports
          path: |
            pomme/build/reports/coverage/test/debug/**
            sample/build/reports/coverage/test/debug/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run sample instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :sample:connectedDebugAndroidTest
